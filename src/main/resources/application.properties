##Logger Configuration 
logging.file.path=/mnt/gda/DesarrolloGDA/logsApisFacturacion/servicePdf/logs
logging.file.name=${logging.file.path}/${spring.application.name}.log
logging.pattern.console= %d{yyyy-dd_dd HH:mm:ss} [%thread] %-5level %logger{36} %L - %msg%n
logging.pattern.file= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} %L- %msg%n
logging.logback.rollingpolicy.file-name-pattern=${logging.file.path}/${spring.application.name}.%d{dd-MM-yyyy}.%i.gz
logging.logback.rollingpolicy.total-size-cap=3GB
logging.logback.rollingpolicy.max-history=8